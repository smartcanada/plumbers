services:
  backend:
    build: ./backend
    container_name: plumbers_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/plumbers
      # SMTP Configuration (Gmail Example)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: plumbers_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8001

  mongo:
    image: mongo:latest
    container_name: plumbers_mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: plumbers_mongo_express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      # Mongo Express Credentials
      ME_CONFIG_BASICAUTH_USERNAME: admin

volumes:
  mongo_data: